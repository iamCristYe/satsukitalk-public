name: Save Content ID

on:
  workflow_dispatch:
    inputs:
      message_content_id:
        description: 'message_content_id'
        required: true
        type: string
      member_name:
        description: 'member_name'
        required: false
        type: string

jobs:
  save-content-id:
    runs-on: ubuntu-latest

    steps:
      - name: Print received payload
        run: |
          echo "message_content_id: ${{ inputs.message_content_id }}"
          echo "member_name: ${{ inputs.member_name }}"

      - name: Clone Private Repo
        env:
          PAT_GITHUB: ${{ secrets.PAT_GITHUB }}
        run: |
          git clone https://x-access-token:${PAT_GITHUB}@github.com/iamCristYE/satsukitalk.git
          cd satsukitalk

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
   
      - name: Run Python script
        run: |
          cd satsukitalk
          python save_content_id.py
        env:
          message_content_id: ${{ inputs.message_content_id }}
          member_name: ${{ inputs.member_name }}

      - name: Commit and Push Changes
        run: |
          cd satsukitalk
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add subject/*.json
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Save content_id - $message_content_id - $(TZ=Asia/Tokyo date)"
            attempt=0
            max_attempts=5
            until [ $attempt -ge $max_attempts ]
            do
              if git push; then
                echo "Changes committed and pushed."
                break
              else
                attempt=$((attempt+1))
                echo "Push failed. Attempt $attempt/$max_attempts. Running git pull and retrying..."
                git pull --rebase
                sleep 10
              fi
            done
            if [ $attempt -eq $max_attempts ]; then
              echo "Push failed after $max_attempts attempts."
              exit 1
            fi
          else
            echo "No changes to commit."
          fi
        env:
          message_content_id: ${{ inputs.message_content_id }}
          member_name: ${{ inputs.member_name }}

      - name: Dispatch workflow in satsukitalk-public (workflow_dispatch)
        env:
          PAT_GITHUB: ${{ secrets.PAT_GITHUB }}
        run: |
            set -euo pipefail
            API_URL="https://api.github.com/repos/iamCristYe/satsukitalk-public/actions/workflows/msg.yml/dispatches"
            curl -sS --fail -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${PAT_GITHUB}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main"}' \
            "${API_URL}"
